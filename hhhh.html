<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Education Website</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


header{
    background:#000;
    position:fixed;
    width:100%;
    top:0;
    left:0;
    z-index:1000;
}

.right nav{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.right nav ul{
    display:flex;
    list-style:none;
    gap:70px;
}

.right ul li a{
    color:#fff;
    text-decoration:none;
    font-size:30px;
    transition:0.3s;
}

.right nav ul li a:hover{
    color:#00bfff;
}



h1{
    font-size:50px;
    margin-bottom:20px;
}

p{
    font-size:20px;
}
</style>

</head>
<body>

<header>
<nav>
<ul>
<li><a href="#home">Home</a></li>
<li><a href="#courses">Courses</a></li>
<li><a href="#gallery">Gallery</a></li>
<li><a href="#contact">Contact</a></li>
</ul>
</nav>
</header>



</body>
</html>
