<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena Animation</title>

<link rel="stylesheet" href="style.css">

</head>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
}

header{

    width:100%;
    background:#10172e;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:15px 40px;

}

.logo-box{

    display:flex;
    flex-direction:column;
    align-items:center;

}

.logo-box img{

    width:220px;
    height:auto;

}

.logo-box h3{

    color:#fff;
    margin-top:10px;
    font-size:28px;
    letter-spacing:1px;

}

nav{

    display:flex;
    gap:30px;

}

nav a{

    color:white;
    text-decoration:none;
    font-size:20px;
    transition:.3s;

}

nav a:hover{

    color:yellow;

}

/* Mobile Responsive */

@media(max-width:768px){

header{

    flex-direction:column;

}

nav{

    margin-top:20px;
    flex-wrap:wrap;
    justify-content:center;

}

nav a{

    font-size:18px;

}

.logo-box img{

    width:180px;

}

.logo-box h3{

    font-size:22px;

}

}
</style>

<body>

<header>

    <div class="logo-box">

        <img src="sk/1.png" alt="Arena Logo">

        <h3>GTB NAGAR CAMP</h3>

    </div>

    <nav>

        <a href="#">Home</a>
        <a href="Courses.html">Courses</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a>

    </nav>

</header>

</body>
</html>
