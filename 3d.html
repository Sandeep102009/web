<style>
    
@keyframes ani{

}

#card{
width:200px;
height:100px;

 //padding-top:10%;

#pic{
display: block;
width: 90%;

#pic1{
    
    display: block;
    top: 0px;
    backface-visibility: visible;



}
#pic2{

     display: block;
    top:200px;
    left: 200px;
    backface-visibility:hidden;



}
#pic3
{

     display: block;
    top:200px;
    left:0px;
    backface-visibility:hidden;
}






</style>
