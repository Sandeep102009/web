<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Section</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#071433;
    font-family:Arial, sans-serif;
    color:white;
}

.container{
    width:90%;
    margin:auto;
    min-height:100vh;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.left{
    width:55%;
}

.left h1{
    font-size:55px;
    line-height:1.3;
}

.icons{
    margin-bottom:30px;
}

.icons i{
    font-size:30px;
    margin-right:20px;
}

.right{
    width:320px;
    background:yellow;
    padding:25px;
    box-shadow:0 0 30px yellow;
}

.right input,
.right textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    font-size:18px;
}

.right button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:30px;
    background:linear-gradient(to right,#00d4ff,#ff00ff);
    color:white;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

    <div class="left">
        <div class="icons">
            Facebook Instagram X YouTube
        </div>

        <h1>
            Join thousands of creators learning
            professional animation, VFX,
            editing & production
        </h1>
    </div>

    <div class="right">
        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Your Email">

        <textarea rows="5"
        placeholder="Tell us about your creative goals"></textarea>

        <button>Submit Application</button>
    </div>


</div>


<!DOCTYPE html>
<html>
<head>
<style>
body{

.country ul{
    list-style:square;
    font-size:40px;
    line-height:80px;
}

.address{
    width:600px;
}

.address h1{
    font-size:50px;
    margin-bottom:20px;
}

.address p{
    font-size:28px;
    line-height:1.5;
}
</style>
</head>
<body>

<div class="container">

    <!-- Left Side -->
    <div class="country">
        <ul>
            <li>India</li>
            <li>USA</li>
            <li>UK</li>
            <li>China</li>
            <li>Nepal</li>
        </ul>
    </div>

    <!-- Right Side -->
    <div class="address">
        <h1>Address :-</h1>
        <p>
            1st Floor, Outram Lines, 38, nr. GTB Nagar Metro Station,
            above Kapoor Abhushan Palace, Kingsway Camp,
            Delhi, 110033
        </p>
    </div>

</div>



</body>
</html>
