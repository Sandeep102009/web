<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sidebar Iframe Layout</title>


<a href="prtce.html">
<img src="sk/sa300.jpg"style="width:3%" title="click to close">
</a>


</head>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: rgb(10, 10, 45);
  }

  .container {
    display: flex;
    height: 100vh;
  }

  /* Sidebar */
  .sidebar {
    width: 220px;
    background: #111;
    color: rgb(235, 225, 225);
    padding-top: 20px;
  }

  .sidebar h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  .sidebar a {
    display: block;
    color: rgb(209, 198, 198);
    padding: 12px 20px;
    text-decoration: none;
    transition: 0.3s;
  }

  .sidebar a:hover {
    background: #914545;
    padding-left: 30px;
  }

  Main content *
  .main {
    flex: 1;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* Mobile Responsive */
  @media(max-width: 768px) {
    .sidebar {
      width: 50px;
    }

    .sidebar h2 {
      font-size: 15px;
    }

    .sidebar a {
      font-size: 12px;
      padding: 13px;
    }
  }
</style>

<body>

<div class="container">

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Menu</h2>
    <a href="index.html" target="frame">🏠 Home</a>
    <a href="page2.html" target="frame">📄 About</a>
    <a href="page3.html" target="frame">📞 Contact</a>
    <a href="https://example.com" target="frame">🌐 Website</a>
  </div>

  <!-- Iframe Content -->
  <div class="main">
    <iframe name="frame" src="page1.html"></iframe>
  </div>

</div>

</body>
</html>
