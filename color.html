<style>
h1{
    text-align: center;
    margin: auto;
    display: flex;
    font-size: 40px;
    font-family: initial;
    color:rgb(102, 16, 56);
    background-color: rgb(21, 170, 120);
    box-shadow:10px 10px 10px rgba(0, 0, 0, 0.87);
   
  
  
    filter: drop-shadow(10px 10px 10px rgba(211, 47, 47, 0.678));
}

body{

//background-color: black;
background-image: url(sk/hh.png);



}



</style>



<body>
    <script>
       var b =document.createElement("button")
       b.innerHTML="<h1>Create Random color of Background</h1>"
       document.body.appendChild(b)
        function  randomcolor()
        {
         document.title="working"
         var red = Math.round(Math.random()*255)
         var green = Math.round(Math.random()*255)
         var blue = Math.round(Math.random()*255)

         var c = "rgb("+red+","+green+","+blue+")"
            //alert(c)
         document.body.style.background =c
        }

       b.onclick = randomcolor

       
    </script>
</body>
