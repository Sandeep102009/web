<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link href="card7.css" rel="stylesheet" type="text/css"> 
<div class="card">
  <div class="header">
    <span class="title">Heart Rate</span>
    <button class="full-stats-btn">Full stats-&gt;</button>
  </div>

  <div class="range">
    <span class="range-value">40-189</span>
    <span class="range-unit">bpm</span>
  </div>

  <div class="date-range">10 - 17 Sep 2022</div>

  <div class="chart-container">
    <div class="avg-line"></div>
    <div class="avg-label">Avg. 57</div>
    <div class="chart">
      <div class="bar-wrapper">
        <div class="bar-container">
          <div class="bar bar-mo"></div>
        </div>
        <div class="day-label">Mo</div>
      </div>

      <div class="bar-wrapper">
        <div class="bar-container">
          <div class="bar bar-tu">
            <div class="dot dot-top"></div>
          </div>
        </div>
        <div class="day-label">Tu</div>
      </div>

      <div class="bar-wrapper">
        <div class="bar-container">
          <div class="bar bar-we">
            <div class="dot dot-bottom"></div>
          </div>
        </div>
        <div class="day-label">We</div>
      </div>

      <div class="bar-wrapper">
        <div class="bar-container">
          <div class="bar bar-th"></div>
        </div>
        <div class="day-label">Th</div>
      </div>

      <div class="bar-wrapper">
        <div class="bar-container">
          <div class="bar bar-fr">
            <div class="dot dot-bottom"></div>
          </div>
        </div>
        <div class="day-label">Fr</div>
      </div>

      <div class="bar-wrapper">
        <div class="bar-container">
          <div class="bar bar-sa"></div>
        </div>
        <div class="day-label">Sa</div>
      </div>

      <div class="bar-wrapper">
        <div class="bar-container">
          <div class="bar bar-su">
            <div class="dot dot-top"></div>
            <div class="dot dot-bottom"></div>
          </div>
        </div>
        <div class="day-label">Su</div>
      </div>
    </div>
  </div>

  <div class="readings">
    <div class="reading">
      <span class="reading-time">Today (14:00)</span>
      <span class="reading-value">125</span>
    </div>
    <div class="reading">
      <span class="reading-time">Today (13:00)</span>
      <span class="reading-value">110</span>
    </div>
  </div>
</div>



<body>
    
</body>
</html>
