<style>

    h1{

    .box{
     font-size: 26px;
     border-radius: 0px;
     transition: 0.50s;
     width:400px;
     
     border: 2px rgb(159, 187, 208) solid;
     position: absolute;
     top: 120px;
     filter: drop-shadow(5px 5px 5px rgb(22, 172, 241));

     text-align: center;

    }
     .mystyle{
        margin: auto;
        display: inline;
        background-color: rgb(149, 199, 183);
position: absolute;
;



     }








    
</style>



<body>
    <script>
        document.title="Create element"

        var d =document.createElement("div");

     
       document.body.appendChild(d);
       d.className="box mystyle"
    
       d.innerHTML="<button style='margin-top:15px; margin-left:210px;'onclick='closedilog()'>X</button>"

        function closedilog()
        {
        document.body.removeChild
        }
    </script>
